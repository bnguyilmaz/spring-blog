spring.application.name=spring-blog
server.port=8082
lastfm.base.url=https://ws.audioscrobbler.com/2.0/
lastfm.user=benguyilmaz
lastfm.api.key=${LASTFM_API_KEY}

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/spring_blog
spring.datasource.username=spring_blog_user
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

