spring.config.import=optional:file:.env[.properties]
spring.application.name=spring-blog
server.port=8084
lastfm.base.url=https://ws.audioscrobbler.com/2.0/
lastfm.api.key=${LASTFM_API_KEY:${LASTFM_API_KEY}}

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/spring_blog
spring.datasource.username=spring_blog_user
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# oauth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
lastfm.api.secret=${LASTFM_API_SECRET:}
lastfm.callback.url=${LASTFM_CALLBACK_URL:http://localhost:8084/lastfm/callback}
