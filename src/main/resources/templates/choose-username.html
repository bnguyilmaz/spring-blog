<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Kullanıcı adını seç')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('profile')}"></header>
<main id="main" class="page narrow-page">
    <section class="panel setup-panel">
        <span class="eyebrow">01 / PROFİLİNİ OLUŞTUR</span>
        <h1>Sana nasıl<br>seslenelim?</h1>
        <p class="muted">Google hesabın doğrulandı. Diğer kullanıcıların seni bulabileceği kullanıcı adını seç; ardından Last.fm hesabını bağlayabilirsin.</p>
        <p th:if="${email != null}" class="field-hint" th:text="${email}"></p>
        <form th:action="@{/choose-username}" method="post" class="stack-form">
            <label for="username">Kullanıcı adın</label>
            <input id="username" name="username" type="text" th:value="${suggestedUsername}" minlength="3" maxlength="50" pattern="[A-Za-z0-9._-]{3,50}" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="username-hint" required>
            <p id="username-hint" class="field-hint">3–50 karakter. Harf, rakam, nokta, alt çizgi ve tire kullanabilirsin.</p>
            <p th:if="${usernameError != null}" th:text="${usernameError}" class="notice notice-error" role="alert"></p>
            <p th:if="${registrationError != null}" th:text="${registrationError}" class="notice notice-error" role="alert"></p>
            <button class="button" type="submit">Devam et <span aria-hidden="true">↗</span></button>
        </form>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
