<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Music</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: #fff;
            margin: 0;
            padding: 20px;
        }

        h1, h2 {
            text-align: center;
        }

        .section {
            margin-bottom: 40px;
        }

        .albums {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .album-card {
            background-color: #1e1e1e;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
        }

        .album-card img {
            width: 100%;
            border-radius: 8px;
        }

        .artists li {
            list-style: none;
            padding: 8px;
            border-bottom: 1px solid #333;
        }
    </style>
</head>

<body>

<h1>My Music</h1>

<!-- 🔹 ALBUMS -->
<div class="section">
    <h2>Top Albums</h2>

    <div class="albums">
        <div class="album-card" th:each="album : ${albums}">
            <img th:src="${album.displayImageUrl}"
                 onerror="this.src='/images/default-album.jpg'">

            <p th:text="${album.name}"></p>
            <p th:text="${album.artist.name}"></p>
            <!--<p th:text="${album.playcount}"></p>
            -->
        </div>
    </div>
</div>
<!-- 🔹 RECENT TRACK -->
<div class="section">
    <h2>Recent Track</h2>

    <div class="tracks">
        <div class="track-card" th:each="track : ${tracks}">
            <img th:src="${track.displayImageUrl}"
                 onerror="this.src='/images/default-track.jpg'">

            <p th:text="${track.name}"></p>
            <p th:text="${track.artist.name}"></p>
            <!--<p th:text="${album.playcount}"></p>
            -->
        </div>
    </div>
</div>

<!-- 🔹 ARTISTS -->
<div class="section">
    <h2>Top Artists</h2>

    <ul class="artists">
        <li th:each="artist : ${artists}">
            <span th:text="${artist.name}"></span>
            -
            <span th:text="${artist.playcount}"></span>
        </li>
    </ul>
</div>

</body>
</html>
