<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Music</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 32px 20px 60px;
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom, #0d0d0d, #161616);
            color: #ffffff;
        }

        .container {
            max-width: 1250px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #b8b8b8;
            margin-bottom: 45px;
            font-size: 15px;
        }

        h2 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 24px;
        }

        .section {
            margin-bottom: 60px;
        }

        .albums {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 22px;
        }

        .album-card {
            background-color: #1b1b1b;
            border-radius: 16px;
            padding: 14px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .album-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.4);
        }

        .album-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 14px;
            display: block;
            background-color: #2a2a2a;
        }

        .album-name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .album-artist {
            font-size: 16px;
            color: #cfcfcf;
        }

        .recentTrack {
            max-width: 780px;
            margin: 0 auto;
        }

        .track-card {
            display: flex;
            align-items: center;
            gap: 24px;
            background-color: #1b1b1b;
            border-radius: 20px;
            padding: 22px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
        }

        .track-card img {
            width: 160px;
            height: 160px;
            object-fit: cover;
            border-radius: 16px;
            background-color: #2a2a2a;
            flex-shrink: 0;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .track-badge {
            display: inline-block;
            background-color: #1db954;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            padding: 6px 10px;
            border-radius: 999px;
            width: fit-content;
            letter-spacing: 0.4px;
        }

        .track-name {
            font-size: 30px;
            font-weight: 700;
            line-height: 1.2;
        }

        .track-artist {
            font-size: 18px;
            color: #d1d1d1;
        }

        .artists {
            max-width: 800px;
            margin: 0 auto;
            padding: 0;
        }

        .artists li {
            list-style: none;
            padding: 16px 18px;
            margin-bottom: 12px;
            background-color: #1b1b1b;
            border-radius: 14px;
            border: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .artists li:hover {
            background-color: #232323;
            transform: translateY(-2px);
        }

        .artist-name {
            font-size: 18px;
            font-weight: 600;
        }

        .artist-playcount {
            font-size: 14px;
            color: #d0d0d0;
            background-color: #2b2b2b;
            padding: 6px 12px;
            border-radius: 999px;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 34px;
            }

            h2 {
                font-size: 25px;
            }

            .track-card {
                flex-direction: column;
                text-align: center;
            }

            .track-card img {
                width: 180px;
                height: 180px;
            }

            .track-info {
                align-items: center;
            }

            .artists li {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <h1>My Music</h1>
    <p class="subtitle">A small corner of what I’ve been listening to lately</p>

    <!-- ALBUMS -->
    <div class="section">
        <h2>Top Albums</h2>

        <div class="albums">
            <div class="album-card" th:each="album : ${albums}">
                <img th:src="${album.displayImageUrl}"
                     alt="Album cover"
                     onerror="this.src='/images/default-album.jpg'">

                <p class="album-name" th:text="${album.name}"></p>
                <p class="album-artist" th:text="${album.artist.name}"></p>
            </div>
        </div>
    </div>

    <!-- RECENT TRACK -->
    <div class="section">
        <h2>Recent Track</h2>

        <div class="recentTrack">
            <div class="track-card" th:each="track : ${recentTrack}">
                <img th:src="${track.displayImageUrl}"
                     alt="Track cover"
                     onerror="this.src='/images/default-track.jpg'">

                <div class="track-info">
                    <span class="track-badge">RECENTLY PLAYED</span>
                    <p class="track-name" th:text="${track.name}"></p>
                    <p class="track-artist" th:text="${track.artist.name}"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- ARTISTS -->
    <div class="section">
        <h2>Top Artists</h2>

        <ul class="artists">
            <li th:each="artist : ${artists}">
                <span class="artist-name" th:text="${artist.name}"></span>
                <span class="artist-playcount" th:text="${artist.playcount + ' plays'}"></span>
            </li>
        </ul>
    </div>

</div>
</body>
</html>
