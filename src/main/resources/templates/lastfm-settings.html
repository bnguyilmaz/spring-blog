<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Last.fm hesabın')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('profile')}"></header>
<main id="main" class="page narrow-page">
    <a class="back-link" th:href="@{/oauth-user}">← Profilime dön</a>
    <section class="panel setup-panel">
        <span class="eyebrow">MÜZİK PROFİLİN</span>
        <h1>Dinlediklerini<br>buraya taşı.</h1>
        <p class="muted">Last.fm kullanıcı adını kaydet; son dinlediklerin, favori sanatçıların ve albümlerin sana özel bir sayfada buluşsun.</p>
        <form th:replace="~{fragments/layout :: lastfmForm}"></form>
        <p class="field-hint">Last.fm hesabın yok mu? <a href="https://www.last.fm/join" target="_blank" rel="noopener noreferrer">Hesap oluştur ↗</a></p>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
